name: MyTerraform CI
on: 
  push: # Trigger the workflow on push events to the main branch
    branches:
      - main
jobs:
  terraform:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up Terraform
      run: terraform init
    - name: Terraform Validate
      run: terraform validate